# .eas\workflows\e2e-test-android.yml
name: e2e-test-android

# on:
#   pull_request:
#     branches: ['*'] # Run the E2E test workflow on every pull request.
on:
  workflow_dispatch: {}
# keeping e2e tests on CI dormant provisionally

jobs:
  build_android_for_e2e:
    type: build
    params:
      platform: android
      profile: e2e-test # your eas build profile for E2E test

  maestro_test:
    needs: [build_android_for_e2e]
    type: maestro
    params:
      build_id: ${{ needs.build_android_for_e2e.outputs.build_id }}
      flow_path: '.maestro'
    env:
      APP_ID: com.shravzzv.still
